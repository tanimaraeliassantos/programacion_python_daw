<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Detalle del producto - {{ producto.nombre }}</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
	</head>
	<body class="bg-light">
		<div class="container mt-5">
			<div class="row justify-content-center">
				<div class="col-md-8 col-lg-6">
					<nav aria-label="breadcrumb" class="mb-4">
						<ol class="breadcrumb">
							<li class="breadcrumb-item">
								<a
									href="{% url 'lista_productos' %}"
									class="text-decoration-none"
									>← Volver al catálogo</a
								>
							</li>
							<li class="breadcrumb-item active" aria-current="page">
								Detalle
							</li>
						</ol>
					</nav>

					<div class="card shadow border-0">
						<div class="card-header bg-dark text-white py-3">
							<h1 class="h3 mb-0 text-center">{{ producto.nombre }}</h1>
						</div>

						<div class="card-body p-4">
							<div class="row mb-3 border-bottom pb-2">
								<div class="col-6 text-muted fw-bold">Precio:</div>
								<div class="col-6 text-end h4 text-primary mb-0">
									{{ producto.precio }} €
								</div>
							</div>

							<div class="row mb-4 border-bottom pb-2">
								<div class="col-6 text-muted fw-bold">Stock disponible:</div>
								<div class="col-6 text-end">
									{% if producto.cantidad > 0 %}
									<span class="badge bg-success fs-6"
										>{{ producto.cantidad }} unidades</span
									>
									{% else %}
									<span class="badge bg-danger fs-6">Agotado</span>
									{% endif %}
								</div>
							</div>

							<div
								class="d-grid gap-2 d-md-flex justify-content-md-center mt-4"
							>
								<a
									href="{% url 'editar_producto' producto.id %}"
									class="btn btn-warning px-4 fw-bold"
								>
									Editar
								</a>

								<a
									href="{% url 'eliminar_producto' producto.id %}"
									class="btn btn-danger px-4 fw-bold"
								>
									Eliminar
								</a>
							</div>
						</div>

						<div class="card-footer text-center text-muted small py-3">
							ID del Producto: #{{ producto.id }}
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
