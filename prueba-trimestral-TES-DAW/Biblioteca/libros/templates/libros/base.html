<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{% block title %}Mi Biblioteca {% endblock %}</title>
		<style>
			body {
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				margin: 20px;
			}
			header {
				background-color: #ede3e3;
				padding: 10px;
				border-radius: 5px;
				margin-bottom: 20px;
			}
			.nav a {
				margin-right: 15px;
				text-decoration: none;
				color: #366291;
				font-weight: bold;
			}
			.nav a:hover {
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>CRUD de Libros</h1>
			<nav class="nav">
				<a href="{% url 'libro_lista' %}">Lista de Libros</a>
				<a href="{% url 'libro_formulario' %}">Crear Nuevo Libro</a>
				<a href="{% url 'admin:index' %}">Admin</a>
			</nav>
		</header>
		<main>{% block content %}{% endblock %}</main>
	</body>
</html>
